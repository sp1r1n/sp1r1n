name: Pasport queue watch

# Free appointment slots at the Wroclaw passport office appear at random and
# get taken within minutes, so poll every half hour and ping Telegram.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pasport-queue
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # Carries the last notified dates between runs so a slot that is still
      # open half an hour later does not ping again.
      - name: Restore previously seen days
        uses: actions/cache/restore@v4
        with:
          path: state
          key: pasport-state-${{ github.run_id }}
          restore-keys: pasport-state-

      - name: Check the queue
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CENTER_ID: '13'
          SERVICE_ID: '4'
        run: |
          mkdir -p state
          python scripts/check_queue.py

      - name: Save seen days
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: pasport-state-${{ github.run_id }}
