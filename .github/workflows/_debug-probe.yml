name: _debug probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -q curl_cffi==0.13.0
      - name: Egress IP
        run: |
          echo "egress IP: $(curl -s https://api.ipify.org)"
      - name: Probe profiles
        run: |
          python - <<'PYEOF'
          from curl_cffi import requests
          import time
          URL = "https://wroclaw.pasport.org.ua/solutions/e-queue"
          for prof in ["chrome", "chrome124", "chrome131", "safari17_0", "firefox133"]:
              try:
                  s = requests.Session(impersonate=prof)
                  r = s.get(URL, timeout=40, headers={"Accept-Language": "uk-UA,uk;q=0.9,en;q=0.8"})
                  print("%-12s -> %s cf-mitigated=%s len=%s" % (
                      prof, r.status_code, r.headers.get("cf-mitigated"), len(r.text)))
                  print("             body: %s" % r.text[:110].replace("\n", " "))
              except Exception as e:
                  print("%-12s -> EXC %s %s" % (prof, type(e).__name__, str(e)[:80]))
              time.sleep(8)
          PYEOF
